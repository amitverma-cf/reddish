name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - run: cmake --build build --parallel 4
      - name: Test with sanitizer diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [[ '${{ matrix.sanitizer }}' == thread ]]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-19 shellcheck jq

      - name: Check benchmark scripts
        run: |
          for script in benchmarks/*.sh tests/benchmark_tests.sh; do bash -n "$script"; done
          shellcheck -x benchmarks/*.sh tests/benchmark_tests.sh
          bash tests/benchmark_tests.sh

      - name: Check C++ formatting
        run: |
          find src tests client/C++/src benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) ! -path 'benchmarks/results/*' -print0 \
            | xargs -0 clang-format-19 --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes clang-19 ninja-build
      - run: cmake -S . -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF -DREDDISH_BUILD_FUZZERS=ON -DREDDISH_ENABLE_IPO=OFF
      - run: cmake --build build-fuzz --parallel 4
      - run: bash tests/fuzz.sh build-fuzz/output/reddish_fuzz local/fuzz-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resp-fuzz
          path: local/fuzz-results/
