name: Benchmark summary

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-summary
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install benchmark dependencies
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install --yes curl gpg lsb-release software-properties-common redis-server valkey-server
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install --yes memtier-benchmark
          sudo sysctl -w vm.overcommit_memory=1

      - name: Build Release server
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREDDISH_BUILD_DOCS=OFF
          cmake --build build --parallel

      - name: Run equal-workload benchmark
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/github-actions
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
          KEYS: 100000
          VALUE_BYTES: 32
          THREADS: 1
          CLIENTS: 10
          PIPELINE: 16
          DURATION_SECONDS: 30
          TRIALS: 5
        run: bash benchmarks/run_local.sh

      - name: Update published benchmark summary
        env:
          RESULTS_DIR: ${{ github.workspace }}/benchmarks/results/github-actions
        run: bash benchmarks/publish_results.sh

      - name: Commit updated summary
        run: |
          if git diff --quiet -- benchmarks/benchmarks.md README.md; then
            echo "Benchmark summary did not change."
            exit 0
          fi
          git config user.name "Amit Verma"
          git config user.email "35371348+amitverma-cf@users.noreply.github.com"
          git add benchmarks/benchmarks.md README.md
          git commit -m "Bench: Update GitHub Actions benchmark summary"
          git push
