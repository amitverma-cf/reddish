name: Benchmark artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-summary
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install --yes curl gpg lsb-release software-properties-common redis-server valkey-server memcached valgrind
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install --yes memtier-benchmark
          sudo sysctl -w vm.overcommit_memory=1

      - name: Build Release server
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Run equal-workload benchmark
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/github-actions
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
          KEYS: 100000
          VALUE_BYTES: 32
          THREADS: 1
          CLIENTS: 10
          PIPELINE: 16
          DURATION_SECONDS: 30
          TRIALS: 5
          INCLUDE_MEMCACHED: 1
          REQUIRE_MEMCACHED: 1
        run: bash benchmarks/run_local.sh

      - name: Run profiles
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/github-profile
        run: bash benchmarks/profile.sh
      - name: Measure WAL modes separately
        run: python3 benchmarks/network_profile.py build/output/reddish --output benchmarks/results/github-wal --duration 5 --trials 3
      - name: Preserve raw results and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddish-benchmarks-${{ github.sha }}
          path: benchmarks/results/
