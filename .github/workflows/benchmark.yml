name: Benchmark artifacts
run-name: Benchmark ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full current main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-main
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.commit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BENCHMARK_ENVIRONMENT: GitHub Actions / Ubuntu 24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Verify measured revision
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - name: Install build and profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build git autoconf automake libtool pkg-config libevent-dev libpcre2-dev zlib1g-dev libssl-dev libzstd-dev memcached valgrind jq iproute2 shellcheck time strace linux-tools-generic
          sudo sysctl -w vm.overcommit_memory=1
          if [[ -e /proc/sys/kernel/sched_schedstats ]]; then sudo sysctl -w kernel.sched_schedstats=1 || true; fi
      - name: Check benchmark scripts
        run: |
          for script in benchmarks/*.sh; do bash -n "$script"; done
          shellcheck -x benchmarks/*.sh tests/benchmark_tests.sh
          bash tests/benchmark_tests.sh
      - name: Build pinned comparison tools
        run: |
          set -euo pipefail
          mkdir -p benchmarks/results
          BUILD_JOBS=2 bash benchmarks/install_tools.sh "$RUNNER_TEMP/benchmark-tools" 2>&1 | tee benchmarks/results/tool-build.log
          echo "$RUNNER_TEMP/benchmark-tools/bin" >> "$GITHUB_PATH"
          cp "$RUNNER_TEMP/benchmark-tools/manifest.txt" benchmarks/results/tools.txt
      - name: Build and test Release server
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cmake -LA -N build | grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|CMAKE_CXX_FLAGS_RELEASE|REDDISH_ENABLE_IPO):' > benchmarks/results/build-config.txt
          c++ --version >> benchmarks/results/build-config.txt
          cmake --version >> benchmarks/results/build-config.txt
      - name: Validate supported commands
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/validation
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
        run: bash benchmarks/validate.sh
      - name: Differential command traces
        run: |
          for seed in 731 2026 99991; do
            python3 tests/integration.py build/output/reddish --redis --seed "$seed" --operations 20000 > "benchmarks/results/differential-$seed.log" 2>&1
          done
      - name: Select separate physical cores
        run: |
          source benchmarks/common.sh
          choose_cpus
          echo "SERVER_CPU=$SERVER_CPU" >> "$GITHUB_ENV"
          echo "CLIENT_CPUS=$CLIENT_CPUS" >> "$GITHUB_ENV"
      - name: Compare throughput and memory
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/comparison
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
          KEYS: 100000
          VALUE_BYTES: 32
          THREADS: 1
          CLIENTS: 10
          PIPELINE: 16
          DURATION_SECONDS: 30
          TRIALS: 5
          MEMORY_TRIALS: 3
          INCLUDE_MEMCACHED: 1
          REQUIRE_MEMCACHED: 1
          RUN_VALIDATION: 0
          OUTPUT_FILE: ${{ github.workspace }}/benchmarks/results/comparison/report.md
          README_FILE: ""
        run: bash benchmarks/run_local.sh
      - name: Measure capacity operating points
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/capacity
          VALIDATION_DIR: ${{ github.workspace }}/benchmarks/results/validation
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
          TRIALS: 3
          DURATION_SECONDS: 5
          P99_LIMIT_MS: 2
        run: bash benchmarks/capacity.sh
      - name: Test pressure and crash recovery
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/pressure
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
        run: timeout 600 bash benchmarks/pressure.sh
      - name: Check client worker and process limits
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/driver
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
        run: bash benchmarks/driver.sh
      - name: Profile CPU and socket costs
        run: |
          perf_bin=$(find /usr/lib/linux-tools -type f -name perf 2>/dev/null | sort -V | tail -1 || true)
          sudo env PATH="$PATH" PERF_BIN="${perf_bin:-perf}" SERVER_CPU="$SERVER_CPU" CLIENT_CPUS="$CLIENT_CPUS" REDDISH_BINARY="$GITHUB_WORKSPACE/build/output/reddish" RESULT_DIR="$GITHUB_WORKSPACE/benchmarks/results/native-profile" bash benchmarks/profile_native.sh
      - name: Sustain expiry and eviction for thirty minutes
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/soak
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
          SOAK_SECONDS: 1800
        run: bash benchmarks/soak.sh
      - name: Profile command costs
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/profile
        run: bash benchmarks/profile.sh
      - name: Profile real TCP traffic
        run: bash benchmarks/profile_network.sh build/profile/output/reddish benchmarks/results/tcp-profile
      - name: Compare WAL modes
        run: bash benchmarks/network_profile.sh build/output/reddish benchmarks/results/wal
      - name: Write measured report
        run: |
          DRIVER_DIR=benchmarks/results/driver SOAK_DIR=benchmarks/results/soak VALIDATION_DIR=benchmarks/results/validation CAPACITY_DIR=benchmarks/results/capacity PRESSURE_DIR=benchmarks/results/pressure WAL_RESULTS_DIR=benchmarks/results/wal RESULTS_DIR=benchmarks/results/comparison bash benchmarks/publish_results.sh
          cat benchmarks/benchmarks.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p benchmarks/results/published
          cp README.md benchmarks/results/published/README.md
          cp benchmarks/benchmarks.md benchmarks/results/published/benchmarks.md
      - name: Make diagnostics readable by the artifact uploader
        if: always()
        run: |
          if [[ -d "$GITHUB_WORKSPACE/benchmarks/results" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/benchmarks/results"
          fi
      - name: Preserve results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddish-benchmarks-${{ inputs.commit }}
          path: benchmarks/results/
          retention-days: 90
          overwrite: true

  publish:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: reddish-benchmarks-${{ inputs.commit }}
          path: local/measured-report
      - name: Rebuild reports from the measured artifact
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          export RESULTS_DIR=local/measured-report/comparison
          export VALIDATION_DIR=local/measured-report/validation
          export CAPACITY_DIR=local/measured-report/capacity
          export PRESSURE_DIR=local/measured-report/pressure
          export WAL_RESULTS_DIR=local/measured-report/wal
          export DRIVER_DIR=local/measured-report/driver
          export SOAK_DIR=local/measured-report/soak
          bash benchmarks/publish_results.sh
          cmp README.md local/measured-report/published/README.md
          cmp benchmarks/benchmarks.md local/measured-report/published/benchmarks.md
      - name: Publish both reports on main
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
          RESULTS_DIR: local/measured-report/comparison
        run: bash benchmarks/publish_actions.sh
