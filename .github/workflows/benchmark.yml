name: Benchmark artifacts
run-name: Benchmark ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full current main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-main
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Verify measured revision
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - name: Install build and profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build git autoconf automake libtool pkg-config libevent-dev libpcre2-dev zlib1g-dev libssl-dev libzstd-dev memcached valgrind jq iproute2 shellcheck
          sudo sysctl -w vm.overcommit_memory=1
      - name: Check benchmark scripts
        run: |
          for script in benchmarks/*.sh; do bash -n "$script"; done
          shellcheck -x benchmarks/*.sh
      - name: Build pinned comparison tools
        run: |
          set -euo pipefail
          mkdir -p benchmarks/results
          BUILD_JOBS=2 bash benchmarks/install_tools.sh "$RUNNER_TEMP/benchmark-tools" 2>&1 | tee benchmarks/results/tool-build.log
          echo "$RUNNER_TEMP/benchmark-tools/bin" >> "$GITHUB_PATH"
          cp "$RUNNER_TEMP/benchmark-tools/manifest.txt" benchmarks/results/tools.txt
      - name: Build and test Release server
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Compare throughput and memory
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/comparison
          REDDISH_BINARY: ${{ github.workspace }}/build/output/reddish
          KEYS: 100000
          VALUE_BYTES: 32
          THREADS: 1
          CLIENTS: 10
          PIPELINE: 16
          DURATION_SECONDS: 30
          TRIALS: 5
          MEMORY_TRIALS: 3
          INCLUDE_MEMCACHED: 1
          REQUIRE_MEMCACHED: 1
        run: bash benchmarks/run_local.sh
      - name: Profile command costs
        env:
          RESULT_DIR: ${{ github.workspace }}/benchmarks/results/profile
        run: bash benchmarks/profile.sh
      - name: Profile real TCP traffic
        run: bash benchmarks/profile_network.sh build/profile/output/reddish benchmarks/results/tcp-profile
      - name: Compare WAL modes
        run: bash benchmarks/network_profile.sh build/output/reddish benchmarks/results/wal
      - name: Write measured report
        run: |
          WAL_RESULTS_DIR=benchmarks/results/wal RESULTS_DIR=benchmarks/results/comparison bash benchmarks/publish_results.sh
          cat benchmarks/benchmarks.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddish-benchmarks-${{ inputs.commit }}
          path: |
            benchmarks/results/
            benchmarks/benchmarks.md
            README.md
          retention-days: 14
